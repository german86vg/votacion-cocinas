<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votación de estilos de cocina · Home Vega × OPPEIN</title>
<style>
:root{--y:#fecf0b;--g:#4f4f4f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#4f4f4f;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:#fff;color:#4f4f4f;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:14px;border-bottom:4px solid #fecf0b}.top img{height:34px}
.bar{flex:1;height:8px;background:#e8e8ea;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#fecf0b;width:0}
.wrap{max-width:1500px;margin:auto}
.pf{max-width:560px;margin:0 auto;padding:28px 20px;background:#fff;color:#333;min-height:100vh;border-top:8px solid #fecf0b}
.pf h1{color:#4f4f4f;font-size:24px;margin:0 0 6px}.pf p{line-height:1.45}.logo{height:78px;display:block;margin:0 0 14px}
label{display:block;margin:14px 0 4px;font-weight:bold;font-size:14px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #b9b9bd;border-radius:8px}
.btn{background:#fecf0b;color:#3a3a3a;font-weight:bold;border:0;padding:14px 22px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:18px;width:100%}
.btn.sec{background:#ececee;color:#4f4f4f;font-weight:normal}
.stage{position:relative;background:#fff;text-align:center}
.stage img.main{width:100%;max-height:calc(100vh - 270px);object-fit:contain;display:block;margin:auto;cursor:zoom-in}
.nav{position:absolute;top:40%;background:#4f4f4fb0;color:#fff;border:0;font-size:34px;width:48px;height:72px;cursor:pointer;border-radius:6px}
.nav.l{left:4px}.nav.r{right:4px}
.thumbs{display:flex;gap:6px;justify-content:center;padding:6px;background:#fff}.thumbs img{height:54px;border:3px solid transparent;cursor:pointer;border-radius:4px}.thumbs img.on{border-color:#fecf0b}
.info{padding:10px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.info h2{margin:0;font-size:26px;color:#4f4f4f}.info small{color:#777;font-size:13px}
.votes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 12px 24px}
.v{padding:14px 4px;border-radius:12px;border:2px solid #d3d3d7;background:#f6f6f7;color:#4f4f4f;font-size:15px;cursor:pointer;text-align:center}
.v b{display:block;font-size:24px}.v.on{border-color:#4f4f4f;background:#fecf0b;color:#2d2d2d;font-weight:bold}.v.s0.on{background:#4f4f4f;border-color:#4f4f4f;color:#fff}
.lb{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px 0}
.g{position:relative;cursor:pointer;border:4px solid #e3e3e6;border-radius:8px;overflow:hidden;background:#fff}.g img{width:100%;display:block}.g span{position:absolute;left:0;right:0;bottom:0;background:#4f4f4fd0;color:#fff;padding:4px 6px;font-size:12px}
.g.sel{border-color:#fecf0b}.g em{position:absolute;top:6px;right:6px;background:#fecf0b;color:#2d2d2d;font-style:normal;font-weight:bold;border-radius:50%;width:30px;height:30px;line-height:30px;font-size:16px;text-align:center}
.pad{padding:16px}
@media(max-width:700px){.info h2{font-size:21px}.nav{height:56px;width:38px}}
</style></head><body>
<div id="app"></div><div class="lb" id="lb" onclick="this.style.display='none'"><img id="lbi"></div>
<script src="catalogo.js"></script><script src="config.js"></script>
<script>
function imgFail(e){if(!e.dataset.t){e.dataset.t=1;e.src=e.src.replace('/img/','/')}}
const CAT=window.CATALOGO,CFG=window.CONFIG,$=s=>document.querySelector(s);
const SC={3:['😍','Me encanta'],2:['👍','Me gusta'],1:['😐','Neutral'],0:['👎','No me gusta']};
let S=JSON.parse(localStorage.getItem('hv_survey')||'null');
const save=()=>localStorage.setItem('hv_survey',JSON.stringify(S));
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function mkOrder(){const r=rng(Date.now()%100000+7);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 return sh(CAT.filter(x=>x.part=='A').map(x=>x.id)).concat(sh(CAT.filter(x=>x.part=='B').map(x=>x.id)))}
const get=id=>CAT.find(x=>x.id==id);
function render(){const a=$('#app');
 if(!S||S.step=='profile')return profile(a);
 if(S.step=='cards')return cards(a);
 if(S.step=='top')return topScreen(a);
 return done(a)}
function profile(a){a.innerHTML=`<div class="pf"><img class="logo" src="logo_homevega.png"><h1>Votación de estilos de cocina</h1><p>Home Vega está definiendo los ambientes de cocina de su showroom OPPEIN. Verás <b>${CAT.length} cocinas</b> (una por pantalla, en grande). Marca cuánto te gusta cada una. Toma unos 10–15 minutos. Para que tu voto cuente, debes calificar todas. No hay respuestas correctas: queremos tu criterio.</p>
 <label>Nombre</label><input id="n"><label>Tu rol</label><select id="r"><option value="">Selecciona…</option><option>Diseñador/a</option><option>Vendedor/a</option><option>Cliente</option><option>Arquitecto/Constructor</option><option>Otro</option></select>
 <label>Tienda / ciudad (opcional)</label><input id="t">
 <button class="btn" onclick="start()">Comenzar</button></div>`}
function start(){const n=$('#n').value.trim(),r=$('#r').value;if(!n||!r)return alert('Completa nombre y rol');
 let ord=mkOrder();
 S={step:'cards',name:n,role:r,store:$('#t').value,order:ord,i:0,ans:{},top:[],comment:'',start:new Date().toISOString(),img:{}};save();render()}
function cards(a){const id=S.order[S.i],x=get(id),k=S.img[id]||0,sc=S.ans[id];
 const pct=Math.round(S.i/S.order.length*100);
 a.innerHTML=`<div class="top"><img src="logo_homevega.png"><div class="bar"><i style="width:${pct}%"></i></div><span><b>${S.i+1}</b> / ${S.order.length}</span></div>
 <div class="wrap"><div class="stage"><img class="main" src="img/${x.imgs[k]}" onerror="imgFail(this)" onclick="zoom(this.src)">
 <button class="nav l" onclick="mv(-1)">‹</button><button class="nav r" onclick="mv(1)">›</button></div>
 ${x.imgs.length>1?`<div class="thumbs">${x.imgs.map((f,j)=>`<img src="img/${f}" onerror="imgFail(this)" class="${j==k?'on':''}" onclick="S.img['${id}']=${j};render()">`).join('')}</div>`:''}
 <div class="info"><h2>${x.name}</h2><small style="width:100%;order:3">👆 Toca la foto para ampliarla</small><small>${x.mat}${x.plcc?' · '+x.plcc:''}${x.style?' · '+x.style:''}</small></div>
 <div class="votes">${[3,2,1,0].map(s=>`<button class="v s${s} ${sc===s?'on':''}" onclick="vote(${s})"><b>${SC[s][0]}</b>${SC[s][1]}</button>`).join('')}</div></div>`;
 const nx=S.order[S.i+1];if(nx){{const im=new Image();im.onerror=()=>{im.src=im.src.replace('/img/','/')};im.src='img/'+get(nx).imgs[0]}}}
function vote(s){S.ans[S.order[S.i]]=s;save();setTimeout(()=>mv(1),180);cards($('#app'))}
function mv(d){const n=S.i+d;if(n<0)return;if(n>=S.order.length){return finishCards()}S.i=n;save();render();scrollTo(0,0)}
function finishCards(){const un=S.order.filter(i=>S.ans[i]===undefined);
 if(un.length){alert(`Te faltan ${un.length} cocinas por calificar. Te llevo a la primera pendiente.`);S.i=S.order.indexOf(un[0]);save();return render()}
 S.step='top';save();render();scrollTo(0,0)}
function topScreen(a){let pool=S.order.filter(i=>S.ans[i]===3);if(pool.length<3)pool=S.order.filter(i=>S.ans[i]>=2);
 a.innerHTML=`<div class="pf" style="max-width:1200px"><img class="logo" src="logo_homevega.png" style="height:60px"><h1>Tu Top 3</h1><p>Toca tus 3 cocinas favoritas, en orden: la 1ª es la que más te gusta. Toca otra vez para quitar.</p>
 <div class="grid">${pool.map(i=>{const x=get(i),p=S.top.indexOf(i);return`<div class="g ${p>=0?'sel':''}" onclick="pick('${i}')"><img src="img/${x.imgs[0]}" onerror="imgFail(this)">${p>=0?`<em>${p+1}</em>`:''}<span>${x.name}</span></div>`}).join('')}</div>
 <label>¿Algo que quieras comentar? (colores, materiales, lo que NO debería faltar)</label><textarea id="cm" rows="3">${S.comment||''}</textarea>
 <button class="btn" onclick="send()">Enviar mis votos</button><button class="btn sec" onclick="S.step='cards';S.i=0;save();render()">← Volver a revisar</button></div>`}
function pick(i){const p=S.top.indexOf(i);if(p>=0)S.top.splice(p,1);else if(S.top.length<3)S.top.push(i);S.comment=$('#cm').value;save();topScreen($('#app'))}
function payload(){return{name:S.name,role:S.role,store:S.store,answers:S.ans,top3:S.top,comment:$('#cm')?$('#cm').value:S.comment,started_at:S.start}}
async function send(){const p=payload();let ok=false;
 if(CFG.SUPABASE_URL){try{const r=await fetch(CFG.SUPABASE_URL+'/rest/v1/responses',{method:'POST',headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(p)});ok=r.ok}catch(e){}}
 S.sent=ok;S.step='done';S.final=p;save();render()}
function done(a){a.innerHTML=`<div class="pf"><h1>¡Gracias, ${S.name}!</h1>${S.sent?'<p>Tus votos se enviaron correctamente.</p>':`<p>${CFG.SUPABASE_URL?'No hubo conexión. ':''}Descarga tu archivo y envíalo a quien te compartió la encuesta.</p><button class="btn" onclick="dl()">Descargar mis votos</button>`}
 <button class="btn sec" onclick="localStorage.removeItem('hv_survey');S=null;render()">Nueva respuesta (otra persona)</button></div>`}
function dl(){const b=new Blob([JSON.stringify(S.final,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='votos_'+S.name.replace(/\W+/g,'_')+'.json';a.click()}
function zoom(s){$('#lbi').src=s;$('#lb').style.display='flex'}
document.addEventListener('keydown',e=>{if(S&&S.step=='cards'){if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1);if('0123'.includes(e.key)&&e.key!=='')vote(+e.key)}});
let tx=0;document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);document.addEventListener('touchend',e=>{if(S&&S.step=='cards'){const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>80)mv(d<0?1:-1)}});
render();
</script></body></html>
